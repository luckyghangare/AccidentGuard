# Final Fix for Connection Timeout
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=600000 -Dsun.net.client.defaultReadTimeout=600000

# Ensure no proxy is interfering
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonFinalResIds=false
